name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    # Mod Hub is a Windows app (Steam/Vortex/MO2 paths, tasklist); test where it runs.
    runs-on: windows-latest
    env:
      # Builds and tests don't need the Electron binary itself.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
