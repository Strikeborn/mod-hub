name: Release

# Push a tag like v0.2.0 to build the Windows installer and attach it to a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Mod-Hub-Setup-*.exe
            release/Mod-Hub-Setup-*.exe.blockmap
          generate_release_notes: true
